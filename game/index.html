<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Get To Work</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<style>
  :root{
    --bg:#000; --accent:#f1c40f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}

  /* ===== Unity 运行区 ===== */
  #unity-container{position:absolute;inset:0;display:none;background:#000}
  #unity-canvas{width:100%;height:100%;display:block;outline:none;background:#000;touch-action:none}

  /* ===== 加载屏：只有进度条，无任何文字 ===== */
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:5}
  #boot.off{display:none}
  #boot .track{width:min(58vw,360px);height:3px;background:#1b1b1f;overflow:hidden}
  #boot .fill{height:100%;width:0%;background:var(--accent)}

  /* ===== 按键控制系统：底部极简提示，自动淡出，按 H 再显 ===== */
  #keys{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    padding:6px 12px;background:rgba(12,12,14,.55);border-radius:99px;
    font-size:12px;color:#dcdce0;pointer-events:none;z-index:6;
    transition:opacity .6s ease;max-width:94vw}
  #keys.hide{opacity:0}
  #keys .k{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  #keys b{font-weight:700;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}

  /* ===== 资源缺失兜底：仅一行极简文字 ===== */
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:var(--bg);color:#8a8a90;font-size:13px;text-align:center;padding:24px;z-index:7}
  #fallback.on{display:flex}
</style>
</head>
<body>

<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="boot">
  <div class="track"><div class="fill" id="bootFill"></div></div>
</div>

<div id="keys" class="hide"></div>

<div id="fallback">游戏资源未就绪</div>

<script src="unity-loader.js"></script>
<script>
(function () {
  // 按键控制系统：按需修改这里的键位即可（你告诉我真实键位我再改）
  var KEYS = [
    ['WASD', '移动'], ['鼠标', '视角'], ['空格', '跳跃'],
    ['Shift', '奔跑'], ['E', '互动'], ['ESC', '菜单']
  ];
  var keysEl = document.getElementById('keys');
  keysEl.innerHTML = KEYS.map(function (k) {
    return '<span class="k"><b>' + k[0] + '</b>' + k[1] + '</span>';
  }).join('');

  var container = document.getElementById('unity-container');
  var boot      = document.getElementById('boot');
  var bootFill  = document.getElementById('bootFill');
  var fallback  = document.getElementById('fallback');

  function setProgress(v) {
    bootFill.style.width = Math.max(0, Math.min(100, v * 100)) + '%';
  }

  var hintTimer = null;
  function showKeys() {
    keysEl.classList.remove('hide');
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { keysEl.classList.add('hide'); }, 6000);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'h' || e.key === 'H') showKeys();
  });

  function showFallback() {
    boot.classList.add('off');
    container.style.display = 'none';
    fallback.classList.add('on');
  }

  function startUnity() {
    container.style.display = 'block';
    var canvas = document.getElementById('unity-canvas');
    // 点击/触摸即把键盘焦点交给画布，确保按键控制系统立即生效
    container.addEventListener('pointerdown', function () { try { canvas.focus(); } catch (e) {} });

    window.GTW.boot({
      canvas: canvas,
      onStage: function () {},          // 不显示任何文字
      onProgress: setProgress
    }).then(function () {
      boot.classList.add('off');
      try { canvas.focus(); } catch (e) {}
      setTimeout(function () { window.GTW.releaseBlobs(); }, 20000);
      showKeys();                       // 进游戏即显示按键提示
    }).catch(function (err) {
      var msg = String((err && err.message) || err);
      if (msg === 'no-manifest' || msg === 'bad-manifest') {
        showFallback();
      } else {
        console.error(err);
        showFallback();
      }
    });
  }

  startUnity();
})();
</script>
</body>
</html>
