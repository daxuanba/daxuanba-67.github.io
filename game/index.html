<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Get To Work</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#e8e8ea}
  #unity-container{position:absolute;inset:0;width:100%;height:100%}
  #unity-canvas{width:100%;height:100%;background:#000;display:block;outline:none}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:24px;background:#08080a}
  #msg h1{font-size:18px;font-weight:800;letter-spacing:1px}
  #msg p{font-size:12px;color:#8a8a90;line-height:1.9;max-width:420px}
  #msg code{background:#191920;padding:1px 6px;border-radius:4px;color:#f1c40f}
  .hide{display:none !important}
</style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="msg" class="hide">
  <h1>游戏文件未部署</h1>
  <p>WebGL 构建产物还没放到 <code>game/</code> 目录。<br>
     放入 <code>Build/</code> 与 <code>build.json</code> 后刷新即可开玩。</p>
</div>

<script>
(function () {
  var post = function (obj) {
    try { parent.postMessage(obj, '*'); } catch (e) {}
  };

  function start(cfg) {
    var canvas = document.getElementById('unity-canvas');
    var s = document.createElement('script');
    s.src = cfg.loaderUrl;
    s.onload = function () {
      createUnityInstance(canvas, cfg, function (v) {
        post({ type: 'unity-progress', value: v });
      }).then(function () {
        post({ type: 'unity-progress', value: 1 });
        post({ type: 'unity-ready' });
        try { canvas.focus(); } catch (e) {}
      }).catch(function (err) {
        console.error(err);
        post({ type: 'unity-error', message: String(err && err.message || err) });
      });
    };
    s.onerror = function () {
      document.getElementById('msg').classList.remove('hide');
      post({ type: 'game-missing' });
    };
    document.body.appendChild(s);
  }

  fetch('build.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(start)
    .catch(function () {
      document.getElementById('msg').classList.remove('hide');
      post({ type: 'game-missing' });
    });
})();
</script>
</body>
</html>
